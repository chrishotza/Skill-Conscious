name: consciousness-runtime-dissociation

on:
  push:
    paths:
      - "src/skill_conscious/**"
      - "experiments/**"
      - "tests/test_consciousness_runtime_dissociation_v1.py"
      - "docs/CONSCIOUSNESS_RUNTIME_DISSOCIATION_V1.md"
      - ".github/workflows/consciousness-runtime-dissociation.yml"
      - ".github/workflows/consciousness-runtime-dissociation.yml"
  pull_request:
    paths:
      - "src/skill_conscious/**"
      - "experiments/consciousness_runtime_dissociation_v1.py"
      - "tests/test_consciousness_runtime_dissociation_v1.py"
      - "docs/CONSCIOUSNESS_RUNTIME_DISSOCIATION_V1.md"

jobs:
  consciousness-runtime-dissociation:
    name: consciousness-runtime-dissociation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run full-runtime consciousness dissociation
        env:
          PYTHONPATH: .:src
        run: |
          python experiments/consciousness_runtime_dissociation_v1.py
          pytest -q tests/test_consciousness_runtime_dissociation_v1.py
