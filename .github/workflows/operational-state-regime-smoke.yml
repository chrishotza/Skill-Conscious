name: operational-state-regime-smoke

on:
  pull_request:
    paths:
      - "src/skill_conscious/state_regime.py"
      - "src/skill_conscious/core.py"
      - "tests/test_operational_state_regimes.py"
      - "tests/test_operational_state_continuity.py"
      - "experiments/operational_continuity_benchmark.py"
      - "tests/test_operational_continuity_benchmark.py"
      - "experiments/operational_continuity_reversal_benchmark.py"
      - "tests/test_operational_continuity_reversal_benchmark.py"
      - "docs/OPERATIONAL_CONTINUITY_REVERSIBILITY_V1.md"
      - "pyproject.toml"
      - ".github/workflows/operational-state-regime-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install -e ".[dev]"
      - name: Run operational state regime smoke tests
        run: pytest -q tests/test_operational_state_regimes.py tests/test_operational_state_continuity.py tests/test_operational_continuity_benchmark.py tests/test_operational_continuity_reversal_benchmark.py
