name: conscious-access-smoke

on:
  push:
    branches:
      - feat/pre-reflective-conscious-core-v1
  pull_request:
    paths:
      - "src/skill_conscious/access.py"
      - "src/skill_conscious/core.py"
      - "tests/test_conscious_access_bandwidth.py"
      - "src/skill_conscious/experience_geometry.py"
      - "src/skill_conscious/__init__.py"
      - "tests/test_experience_geometry.py"

jobs:
  access-smoke:
    name: access-bandwidth
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run access bandwidth tests
        run: |
          python - <<'PY'
          import faulthandler
          import pytest

          faulthandler.enable()
          faulthandler.dump_traceback_later(60, repeat=True)
          raise SystemExit(
              pytest.main([
                  "-q",
                  "-x",
                  "--durations=20",
                  "tests/test_conscious_access_bandwidth.py",
                  "tests/test_experience_geometry.py",
              ])
          )
          PY
