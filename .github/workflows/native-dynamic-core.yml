name: native-dynamic-core

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/native-dynamic-core.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/native-dynamic-core.yml"

concurrency:
  group: native-dynamic-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run test suite
        env:
          PYTHONFAULTHANDLER: "1"
        run: |
          python - <<'PY'
          import faulthandler
          import pytest

          faulthandler.enable()
          faulthandler.dump_traceback_later(30, repeat=True)
          raise SystemExit(pytest.main(["-vv", "-x", "--durations=20"]))
          PY
