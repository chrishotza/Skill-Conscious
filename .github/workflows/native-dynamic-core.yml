name: native-dynamic-core

on:
  pull_request:
    paths:
      - "src/skill_conscious/**"
      - "tests/**"
      - "skills/skill-conscious/references/ARCHITECTURE.md"
  push:
    branches:
      - main

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run test suite
        env:
          PYTHONFAULTHANDLER: "1"
        run: |
          python - <<'PY'
          import faulthandler
          import pytest

          faulthandler.enable()
          faulthandler.dump_traceback_later(60, repeat=True)
          raise SystemExit(pytest.main(["-q", "-x", "--durations=20"]))
          PY
