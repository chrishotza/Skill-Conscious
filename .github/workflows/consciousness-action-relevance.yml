name: consciousness-action-relevance

on:
  push:
    paths:
      - "src/skill_conscious/**"
      - "experiments/consciousness_action_relevance_v1.py"
      - "experiments/__init__.py"
      - "tests/test_consciousness_action_relevance_v1.py"
      - ".github/workflows/consciousness-action-relevance.yml"
  pull_request:
    paths:
      - "src/skill_conscious/**"
      - "experiments/consciousness_action_relevance_v1.py"
      - "experiments/__init__.py"
      - "tests/test_consciousness_action_relevance_v1.py"
      - ".github/workflows/consciousness-action-relevance.yml"

jobs:
  consciousness-action-relevance:
    name: consciousness-action-relevance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run action relevance causal battery
        env:
          PYTHONPATH: .:src
        run: |
          python experiments/consciousness_action_relevance_v1.py
          pytest -q tests/test_consciousness_action_relevance_v1.py
