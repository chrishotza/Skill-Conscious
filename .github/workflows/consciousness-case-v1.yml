name: consciousness-case-v1

on:
  push:
    branches:
      - system-canonicalization-v1
  pull_request:
    paths:
      - "src/skill_conscious/**"
      - "experiments/consciousness_case_benchmark.py"
      - "tests/test_consciousness_case_benchmark.py"
      - "tests/test_case_standard.py"
      - "tests/test_system_contract.py"
      - "docs/CONSCIOUSNESS_CASE_BENCHMARK.md"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run canonical subsystem tests
        run: >-
          python -m pytest -q
          tests/test_case_standard.py
          tests/test_system_contract.py
          tests/test_adversarial_battery.py
          tests/test_consciousness_case_benchmark.py
      - name: Execute benchmark
        run: python -m experiments.consciousness_case_benchmark