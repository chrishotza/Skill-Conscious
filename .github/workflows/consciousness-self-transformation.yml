name: consciousness-self-transformation

on:
  push:
    paths:
      - "src/skill_conscious/**"
      - "experiments/consciousness_self_transformation_v1.py"
      - "experiments/__init__.py"
      - "tests/test_consciousness_self_transformation_v1.py"
      - ".github/workflows/consciousness-self-transformation.yml"
  pull_request:
    paths:
      - "src/skill_conscious/**"
      - "experiments/consciousness_self_transformation_v1.py"
      - "experiments/__init__.py"
      - "tests/test_consciousness_self_transformation_v1.py"
      - ".github/workflows/consciousness-self-transformation.yml"

jobs:
  consciousness-self-transformation:
    name: consciousness-self-transformation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run self-transformation causal battery
        env:
          PYTHONPATH: .:src
        run: |
          python experiments/consciousness_self_transformation_v1.py
          pytest -q tests/test_consciousness_self_transformation_v1.py
