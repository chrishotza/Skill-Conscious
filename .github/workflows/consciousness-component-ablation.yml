name: consciousness-component-ablation

on:
  push:
    paths:
      - "src/skill_conscious/**"
      - "experiments/consciousness_component_ablation_v1.py"
      - "experiments/__init__.py"
      - "tests/test_consciousness_component_ablation_v1.py"
      - "docs/CONSCIOUSNESS_COMPONENT_ABLATION_V1.md"
      - ".github/workflows/consciousness-component-ablation.yml"
  pull_request:
    paths:
      - "src/skill_conscious/**"
      - "experiments/consciousness_component_ablation_v1.py"
      - "experiments/__init__.py"
      - "tests/test_consciousness_component_ablation_v1.py"
      - "docs/CONSCIOUSNESS_COMPONENT_ABLATION_V1.md"
      - ".github/workflows/consciousness-component-ablation.yml"

jobs:
  consciousness-component-ablation:
    name: consciousness-component-ablation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run component ablation battery
        env:
          PYTHONPATH: .:src
        run: |
          python experiments/consciousness_component_ablation_v1.py
          pytest -q tests/test_consciousness_component_ablation_v1.py
