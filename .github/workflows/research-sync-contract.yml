name: research-sync-contract

on:
  pull_request:
    paths:
      - 'research/**'
      - 'papers/**'
      - 'experiments/**'
      - 'docs/**'
      - 'sources/**'
      - 'README.md'
      - 'REPO_MEMORY.md'
      - 'RESEARCH_MAP.md'

jobs:
  research-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Identify changed files
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_BASE_REF}" --depth=1
          git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" > changed.txt
          cat changed.txt

      - name: Verify canonical research state files
        shell: bash
        run: |
          set -euo pipefail
          test -f RESEARCH_MAP.md
          test -f REPO_MEMORY.md
          test -f research/CURRENT_CHECKPOINT.md
          test -f research/CLAIM_FAMILY_REGISTRY.md
          test -f docs/CLAIM_TO_PAPER_PROTOCOL.md
          test -f papers/README.md

      - name: Verify state synchronization on research changes
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq '^(research/|papers/|experiments/|docs/|sources/|README.md$|REPO_MEMORY.md$|RESEARCH_MAP.md$)' changed.txt; then
            grep -qx 'RESEARCH_MAP.md' changed.txt
            grep -qx 'REPO_MEMORY.md' changed.txt
            grep -qx 'research/CURRENT_CHECKPOINT.md' changed.txt
          fi

      - name: Verify navigation contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'research/CURRENT_CHECKPOINT.md' RESEARCH_MAP.md
          grep -q 'research/CLAIM_FAMILY_REGISTRY.md' RESEARCH_MAP.md
          grep -q 'research/CURRENT_CHECKPOINT.md' REPO_MEMORY.md
          grep -q 'research/CLAIM_FAMILY_REGISTRY.md' REPO_MEMORY.md
