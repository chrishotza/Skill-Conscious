name: conscious-geometry-smoke

# Focused geometry validation; full-suite execution stays in native-dynamic-core.

on:
  push:
    paths:
      - "src/skill_conscious/experience_geometry.py"
      - "src/skill_conscious/core.py"
      - "src/skill_conscious/__init__.py"
      - "tests/test_experience_geometry.py"
  pull_request:
    paths:
      - "src/skill_conscious/experience_geometry.py"
      - "src/skill_conscious/core.py"
      - "src/skill_conscious/__init__.py"
      - "tests/test_experience_geometry.py"

jobs:
  geometry-smoke:
    name: experience-geometry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run geometry tests
        run: |
          python - <<'PY'
          import faulthandler
          import pytest

          faulthandler.enable()
          faulthandler.dump_traceback_later(60, repeat=True)
          raise SystemExit(
              pytest.main([
                  "-q",
                  "-x",
                  "--durations=20",
                  "tests/test_experience_geometry.py",
              ])
          )
          PY
