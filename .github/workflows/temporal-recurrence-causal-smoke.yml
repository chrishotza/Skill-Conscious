name: temporal-recurrence-causal-smoke

on:
  push:
    paths:
      - "src/skill_conscious/core.py"
      - "experiments/temporal_recurrence_causal_benchmark.py"
      - "tests/test_temporal_recurrence_causal_benchmark.py"
      - ".github/workflows/temporal-recurrence-causal-smoke.yml"
  pull_request:
    paths:
      - "src/skill_conscious/core.py"
      - "experiments/temporal_recurrence_causal_benchmark.py"
      - "tests/test_temporal_recurrence_causal_benchmark.py"
      - ".github/workflows/temporal-recurrence-causal-smoke.yml"

jobs:
  temporal-recurrence-causal:
    name: temporal-recurrence-causal
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run temporal recurrence causal benchmark
        env:
          PYTHONFAULTHANDLER: "1"
        run: python -m pytest -q -x tests/test_temporal_recurrence_causal_benchmark.py
