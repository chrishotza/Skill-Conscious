name: conscious-embodiment-smoke

on:
  push:
    paths:
      - "src/skill_conscious/embodiment.py"
      - "src/skill_conscious/core.py"
      - "src/skill_conscious/experience_geometry.py"
      - "src/skill_conscious/__init__.py"
      - "tests/test_embodiment.py"
  pull_request:
    paths:
      - "src/skill_conscious/embodiment.py"
      - "src/skill_conscious/core.py"
      - "src/skill_conscious/experience_geometry.py"
      - "src/skill_conscious/__init__.py"
      - "tests/test_embodiment.py"

jobs:
  embodiment-smoke:
    name: embodiment-ownership
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run embodiment tests
        run: |
          python - <<'PY'
          import faulthandler
          import pytest

          faulthandler.enable()
          faulthandler.dump_traceback_later(60, repeat=True)
          raise SystemExit(
              pytest.main([
                  "-q",
                  "-x",
                  "--durations=20",
                  "tests/test_embodiment.py",
              ])
          )
          PY
