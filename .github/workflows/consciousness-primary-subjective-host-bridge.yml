name: Consciousness - Primary Subjective Host Bridge v1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/skill_conscious/host.py"
      - "src/skill_conscious/core.py"
      - "src/skill_conscious/primary_subjective_substrate.py"
      - "experiments/primary_subjective_host_bridge_v1.py"
      - "tests/test_primary_subjective_host_bridge_v1.py"
      - ".github/workflows/consciousness-primary-subjective-host-bridge.yml"

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - run: python -m pytest -q tests/test_primary_subjective_host_bridge_v1.py
