name: system-contract

on:
  push:
    branches:
      - system-canonicalization-v1
    paths:
      - "src/skill_conscious/**"
      - "tests/**"
      - "experiments/consciousness_case_benchmark.py"
      - "sources/**"
      - "docs/**"
      - "pyproject.toml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run canonical subsystem tests
        run: >-
          python -m pytest -q
          tests/test_system_contract.py
          tests/test_case_standard.py
          tests/test_adversarial_battery.py
          tests/test_core.py
          tests/test_consciousness_case_benchmark.py
          tests/test_canonical_corpus.py
          tests/test_claim_ledger.py
      - name: Execute operational benchmark
        run: python -m experiments.consciousness_case_benchmark
      - name: Write benchmark JSON
        run: python -m experiments.consciousness_case_benchmark --json > consciousness_case_v1_result.json
      - name: Upload benchmark result
        uses: actions/upload-artifact@v4
        with:
          name: consciousness-case-v1-result
          path: consciousness_case_v1_result.json