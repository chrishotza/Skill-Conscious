name: system-contract

on:
  push:
    branches:
      - system-canonicalization-v1
    paths:
      - "src/skill_conscious/**"
      - "tests/**"
      - "docs/CANONICAL_SYSTEM.md"
      - "pyproject.toml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run system contract and core tests
        run: python -m pytest -q tests/test_system_contract.py tests/test_core.py
