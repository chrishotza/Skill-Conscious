name: homeostatic-reversal-smoke

on:
  push:
    paths:
      - "src/skill_conscious/core.py"
      - "tests/test_self_development.py"
      - "pyproject.toml"
      - ".github/workflows/homeostatic-reversal-smoke.yml"
  pull_request:
    paths:
      - "src/skill_conscious/core.py"
      - "tests/test_self_development.py"
      - "pyproject.toml"
      - ".github/workflows/homeostatic-reversal-smoke.yml"

jobs:
  reversal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install -e ".[dev]"
      - name: Run isolated homeostatic reversal test
        env:
          PYTHONFAULTHANDLER: "1"
        run: pytest -vv -s tests/test_self_development.py::test_homeostatic_reversal_requires_hysteresis
