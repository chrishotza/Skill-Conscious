name: homeostatic-reversal-smoke

on:
  push:
    paths:
      - "src/skill_conscious/core.py"
      - "tests/test_self_development.py"
      - "pyproject.toml"
      - ".github/workflows/homeostatic-reversal-smoke.yml"
  pull_request:
    paths:
      - "src/skill_conscious/core.py"
      - "tests/test_self_development.py"
      - "pyproject.toml"
      - ".github/workflows/homeostatic-reversal-smoke.yml"

jobs:
  reversal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install -e ".[dev]"
      - name: Reproduce homeostatic reversal in fresh processes
        env:
          PYTHONFAULTHANDLER: "1"
          PYTHONMALLOC: "debug"
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            echo "=== isolated reversal run $i/10 ==="
            python -X faulthandler -m pytest -q -s               tests/test_self_development.py::test_homeostatic_reversal_requires_hysteresis
          done
      - name: Run self-development file in one process
        env:
          PYTHONFAULTHANDLER: "1"
        run: |
          python -X faulthandler -m pytest -q -x tests/test_self_development.py
